<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Leaderboard | PromptChamp</title><script type="module" src="/leaderboard.ts"></script><link rel="icon" type="image/svg+xml" href="/brand-mark.svg"><meta name="theme-color" content="#42522b"></head>
<body class="leaderboard-page">
<header class="top"><div class="shell nav"><a class="brand" href="/" aria-label="PromptChamp home"><img class="brand-icon" src="/brand-mark.svg" width="40" height="40" alt="" aria-hidden="true"><span>PromptChamp</span></a><span class="pill">Published results</span></div></header>
<main class="shell"><header class="play-head"><div><div class="eyebrow">The results</div><h1 id="board-title">Prompt champions.</h1><p id="board-description">See what each team created. Select an image to present it.</p></div><button type="button" class="button" id="fullscreen" hidden>Full screen</button></header><p id="board-status" role="status"></p><section id="board" aria-live="polite">Loading results...</section></main>

<footer class="shell"><span>PromptChamp</span><span class="creator-credit"><img src="/brand-mark.svg" width="20" height="20" alt="" aria-hidden="true"><span>Powered by <strong>Mizanur</strong></span></span></footer>
