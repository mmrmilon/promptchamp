[build]
command = "npm run build"
publish = "dist"

# Explicit routes in public/_redirects own URL normalization.
[build.processing.html]
pretty_urls = false

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
included_files = ["public/challenges/*.webp", "db/root-ca.pem"]
